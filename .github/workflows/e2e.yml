name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: a PR without a working changeset never reaches the e2e matrix, which
  # publishes to a registry and generates a plugin per type. Mirrors the
  # changeset-check job on verdaccio/verdaccio master.
  changeset-check:
    name: Changeset file check
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.head_ref != 'changeset-release/master' &&
      !contains(github.event.pull_request.labels.*.name, 'skip changeset')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Check changeset
        uses: ./.github/actions/changeset-check

  e2e:
    needs: [changeset-check]
    runs-on: ubuntu-latest
    # Avoid running on draft PRs. `always() && !failure() && !cancelled()` lets
    # the matrix still run when the gate was skipped (bots, release PRs), but
    # not when it failed.
    if: ${{ always() && !failure() && !cancelled() && github.event.pull_request.draft == false }}
    strategy:
      matrix:
        plugin-type: [auth, storage, middleware, filter]
    services:
      verdaccio:
        image: verdaccio/verdaccio:6
        ports:
          - 4873:4873

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: install
        run: pnpm install
      - name: build
        run: pnpm build
      - name: login
        run: npx npm-cli-login -u test -p 1234 -e test@domain.test -r http://localhost:4873
      - name: pre-release
        run: npm version patch --no-git-tag-version
      - name: publish
        run: pnpm publish --registry http://localhost:4873 --no-git-checks
      - name: install yeoman
        run: npm install -g yo
      - name: install generator
        run: npm install -g generator-verdaccio-plugin --registry http://localhost:4873
      - name: generate ${{ matrix.plugin-type }} plugin
        run: node e2e/run-generator.mjs ${{ matrix.plugin-type }} ${{ github.workspace }}/e2e-output
      - name: install generated plugin deps
        working-directory: e2e-output
        run: npm install
      - name: build generated plugin
        working-directory: e2e-output
        run: npx tsc
